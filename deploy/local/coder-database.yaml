apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: coder-postgres
  namespace: coder
spec:
  instances: 1
  probes:
    liveness:
      failureThreshold: 6
      periodSeconds: 10
      timeoutSeconds: 5
      isolationCheck:
        enabled: false
    readiness:
      failureThreshold: 3
      periodSeconds: 5
      timeoutSeconds: 5
  storage:
    size: 2Gi
  bootstrap:
    initdb:
      database: coder
      owner: coder
  managed:
    roles:
      - name: coder
        ensure: present
        login: true
