kind: Ingress
metadata:
  name: agentic-software-factory
  namespace: factory-platform
  labels:
    factory.application/rollout: factory
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "900"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "900"
spec:
  ingressClassName: nginx
  rules:
    - host: coder.localhost
      http:
        paths:
          - path: /__factory/logout
            pathType: Exact
            backend:
              service:
