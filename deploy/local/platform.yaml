              port: http
            failureThreshold: 60
            timeoutSeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: factory-ca
              mountPath: /etc/factory-ca
              readOnly: true
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: factory-ca
          secret:
            secretName: factory-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
