apiVersion: batch/v1
kind: Job
metadata:
  name: agentic-software-factory-migrate
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentic-software-factory-migrate
    spec:
      restartPolicy: OnFailure
      serviceAccountName: agentic-software-factory-migrate
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: control-plane
          command: [bun, dist/db/run-migrations.js]
          env:
            - name: FACTORY_ENVIRONMENT
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: factory-migration
                  key: DATABASE_URL
            - name: DATABASE_TLS_CA
              valueFrom:
                secretKeyRef:
                  name: factory-migration
                  key: DATABASE_TLS_CA
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
