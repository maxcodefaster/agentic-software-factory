apiVersion: v1
kind: Service
metadata:
  name: agentic-software-factory
  labels:
    app.kubernetes.io/name: agentic-software-factory
spec:
  selector:
    app.kubernetes.io/name: agentic-software-factory
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: agentic-software-factory-metrics
  labels:
    app.kubernetes.io/name: agentic-software-factory-metrics
spec:
  selector:
    app.kubernetes.io/name: agentic-software-factory
  ports:
    - name: metrics
      port: 8080
      targetPort: http
