apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-secrets
  target:
    name: factory-runtime
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: {key: agentic-software-factory/runtime, property: DATABASE_URL}
    - secretKey: DATABASE_TLS_CA
      remoteRef: {key: agentic-software-factory/runtime, property: DATABASE_TLS_CA}
    - secretKey: BETTER_AUTH_SECRET
      remoteRef: {key: agentic-software-factory/runtime, property: BETTER_AUTH_SECRET}
    - secretKey: ENTRA_CLIENT_ID
      remoteRef: {key: agentic-software-factory/runtime, property: ENTRA_CLIENT_ID}
    - secretKey: ENTRA_CLIENT_SECRET
      remoteRef: {key: agentic-software-factory/runtime, property: ENTRA_CLIENT_SECRET}
    - secretKey: CODER_TOKEN
      remoteRef: {key: agentic-software-factory/runtime, property: CODER_TOKEN}
    - secretKey: CODER_OIDC_CLIENT_ID
      remoteRef: {key: agentic-software-factory/runtime, property: CODER_OIDC_CLIENT_ID}
    - secretKey: CODER_OIDC_CLIENT_SECRET
      remoteRef: {key: agentic-software-factory/runtime, property: CODER_OIDC_CLIENT_SECRET}
    - secretKey: CODER_OIDC_REDIRECT_URIS
      remoteRef: {key: agentic-software-factory/runtime, property: CODER_OIDC_REDIRECT_URIS}
    - secretKey: FORGEJO_TOKEN
      remoteRef: {key: agentic-software-factory/runtime, property: FORGEJO_TOKEN}
    - secretKey: FORGEJO_IMPLEMENTATION_TOKEN
      remoteRef: {key: agentic-software-factory/runtime, property: FORGEJO_IMPLEMENTATION_TOKEN}
    - secretKey: FORGEJO_REVIEW_TOKEN
      remoteRef: {key: agentic-software-factory/runtime, property: FORGEJO_REVIEW_TOKEN}
    - secretKey: FORGEJO_OIDC_CLIENT_ID
      remoteRef: {key: agentic-software-factory/runtime, property: FORGEJO_OIDC_CLIENT_ID}
    - secretKey: FORGEJO_OIDC_CLIENT_SECRET
      remoteRef: {key: agentic-software-factory/runtime, property: FORGEJO_OIDC_CLIENT_SECRET}
    - secretKey: FORGEJO_OIDC_REDIRECT_URIS
      remoteRef: {key: agentic-software-factory/runtime, property: FORGEJO_OIDC_REDIRECT_URIS}
    - secretKey: FACTORY_CODER_VERIFICATION_OWNER_ID
      remoteRef: {key: agentic-software-factory/runtime, property: FACTORY_CODER_VERIFICATION_OWNER_ID}
    - secretKey: FACTORY_CODER_STAGING_OWNER_ID
      remoteRef: {key: agentic-software-factory/runtime, property: FACTORY_CODER_STAGING_OWNER_ID}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory-migration
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-secrets
  target:
    name: factory-migration
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef: {key: agentic-software-factory/migration, property: DATABASE_URL}
    - secretKey: DATABASE_TLS_CA
      remoteRef: {key: agentic-software-factory/migration, property: DATABASE_TLS_CA}
