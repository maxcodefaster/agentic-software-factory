apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-secrets
  target:
    name: factory-runtime
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: agentic-software-factory/runtime
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: factory-migration
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-secrets
  target:
    name: factory-migration
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: agentic-software-factory/migration
