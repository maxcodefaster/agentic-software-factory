apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: agentic-software-factory
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: agentic-software-factory-metrics
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: agentic-software-factory
spec:
  groups:
    - name: agentic-software-factory
      rules:
        - alert: ApplicationFactoryUnavailable
          expr: sum(up{job=~".*agentic-software-factory.*"}) < 2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Fewer than two Agentic Software Factory replicas are available
        - alert: ApplicationFactoryWorkspaceStartupFailures
          expr: max(factory_workspace_startup_attempts{outcome="failed",window="15m"}) > 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Workspace startup failures exceeded the operational budget
        - alert: ApplicationFactoryWorkspaceStartupSLOBreach
          expr: max(factory_workspace_startup_duration_milliseconds{outcome="ready",quantile="0.95"}) > 120000
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Workspace startup p95 exceeds two minutes
