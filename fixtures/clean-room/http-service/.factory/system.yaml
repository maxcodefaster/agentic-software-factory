version: 1
development:
  devcontainer: .devcontainer/devcontainer.json
verification:
  devcontainer: .devcontainer/verification/devcontainer.json
runtime:
  supervisor:
    kind: custom
    commands:
      status: ./servicectl status
      attach: ./servicectl watch
      logs: ./servicectl logs
      restart: ./servicectl restart
      shutdown: ./servicectl stop
  startupTimeoutSeconds: 60
applications:
  - slug: api
    displayName: Inventory API
    url: http://127.0.0.1:8088
    verification: required
    health: {url: http://127.0.0.1:8088/health, intervalSeconds: 2, failureThreshold: 15}
