name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag and package versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Release tag must be an exact vX.Y.Z semantic version.\n' >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          VERSION="$version" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const expected = process.env.VERSION;
          const manifests = [
            "package.json",
            "example/package.json",
            "apps/bff/package.json",
            "web/package.json",
            "packages/api-contracts/package.json",
            "packages/db/package.json",
            "packages/design-system/package.json",
          ];
          for (const file of manifests) {
            const manifest = JSON.parse(readFileSync(file, "utf8"));
            if (manifest.version !== expected) {
              throw new Error(`${file} is ${manifest.version}; expected ${expected}`);
            }
            if (manifest.license !== "RPL-1.5") {
              throw new Error(`${file} must declare RPL-1.5`);
            }
          }
          NODE
          grep -Fq "## $version - " CHANGELOG.md
          ! grep -Fq "## $version - Unreleased" CHANGELOG.md
          git fetch --no-tags origin "${{ github.event.repository.default_branch }}:refs/remotes/origin/${{ github.event.repository.default_branch }}"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/${{ github.event.repository.default_branch }}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  checks:
    needs: version
    uses: ./.github/workflows/check.yml
    permissions:
      contents: read

  image:
    needs: [version, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/control-plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate release image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=${{ needs.version.outputs.version }}
          labels: |
            org.opencontainers.image.title=Agentic Software Factory BFF
            org.opencontainers.image.description=Agentic Software Factory reference control plane
            org.opencontainers.image.licenses=RPL-1.5
      - name: Build and publish unadvertised candidate image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/bff/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: ${{ steps.metadata.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Prepare image release directory
        run: mkdir -p release-image
      - name: Scan candidate image
        id: vulnerability-scan
        continue-on-error: true
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: sarif
          output-file: release-image/control-plane-${{ needs.version.outputs.version }}.vulnerabilities.sarif
      - name: Prepare image release metadata
        shell: bash
        run: |
          set -euo pipefail
          printf '%s@%s\n' "$IMAGE" "${{ steps.build.outputs.digest }}" > "release-image/control-plane-${{ needs.version.outputs.version }}.digest"
      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: release-image/control-plane-${{ needs.version.outputs.version }}.spdx.json
          upload-artifact: false
      - name: Enforce all high and critical vulnerability findings
        if: steps.vulnerability-scan.outcome == 'failure'
        run: |
          printf '%s\n' 'Candidate image has a high or critical vulnerability. The gate includes findings without an available fix. Review the release-image SARIF artifact.' >&2
          exit 1
      - name: Publish version tags after vulnerability scan
        env:
          RELEASE_TAGS: ${{ steps.metadata.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            test -z "$tag" || args+=(--tag "$tag")
          done <<< "$RELEASE_TAGS"
          test "${#args[@]}" -eq 4
          docker buildx imagetools create "${args[@]}" "$IMAGE@${{ steps.build.outputs.digest }}"
      - name: Attest published image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest image metadata files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-image/*
      - name: Upload image release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-image
          path: release-image/
          if-no-files-found: error
          retention-days: 14

  github-release:
    needs: [version, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --generate-notes \
            --title "Agentic Software Factory $GITHUB_REF_NAME" \
            --verify-tag
