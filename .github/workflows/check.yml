name: check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      run_e2e:
        description: Run e2e on a prepared Factory runner
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.4.0
      - run: mise run check

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.run_e2e
    runs-on:
      group: factory-e2e
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@5ac50f778e26fac95da98d50503682459e86d566 # v3.4.0
      - run: mise run e2e
