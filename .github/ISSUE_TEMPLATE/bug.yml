name: Bug report
description: Report a reproducible defect in a supported release.
title: "[Bug]: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. Use private vulnerability reporting.
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag, image digest, or commit SHA.
      placeholder: v0.1.0
    validations:
      required: true
  - type: dropdown
    id: environment_kind
    attributes:
      label: Affected environment
      options:
        - Local OrbStack stack
        - Coder developer workspace
        - Coder verification workspace
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, Bun/Node/Docker/Kubernetes, browser/editor, and relevant dependency versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal ordered steps with secrets and personal data removed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Include relevant sanitized output.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and current documentation.
          required: true
        - label: I removed credentials, cookies, personal data, and proprietary source.
          required: true
        - label: This is not a security vulnerability.
          required: true
