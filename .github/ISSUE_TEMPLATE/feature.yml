name: Feature proposal
description: Propose a scoped product, architecture, or operational improvement.
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what cannot be accomplished today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe behavior and boundaries, not only implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and operational impact
      description: Cover migration, security, production boundary, and RPL source obligations where relevant.
    validations:
      required: true
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to submit an RPL-1.5 licensed, DCO-signed contribution.
