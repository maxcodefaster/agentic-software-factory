@if (showSelector()) {
  <factory-context-listbox class="block max-w-56" [ariaLabel]="'applications.selectSystem' | transloco" [triggerText]="systems.activeSystem()?.name || ('factory.systems' | transloco)" triggerIcon="box" [options]="options()" [value]="systems.activeSystem()?.id || null" [emptyText]="'applications.empty' | transloco" [actionLabel]="auth.canManageApplications() ? ('applications.onboarding.create' | transloco) : null" (valueChange)="pick($event)" (action)="createRequested.emit()" />
} @else {
  <span class="flex min-w-0 items-center gap-(--spacing-brand-xs) truncate text-sm font-medium text-brand-gray-900"><factory-icon name="box" size="sm" />{{ systems.activeSystem()?.name || ('factory.systems' | transloco) }}</span>
}
