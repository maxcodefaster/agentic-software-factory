version: 1
development:
  devcontainer: .devcontainer/devcontainer.json
verification:
  devcontainer: .devcontainer/verification/devcontainer.json
runtime:
  supervisor:
    kind: process-compose
    config: .devcontainer/process-compose.yaml
    control:
      address: 127.0.0.1
      port: 8080
    commands:
      status: process-compose --address 127.0.0.1 --port 8080 process list
      attach: process-compose --address 127.0.0.1 --port 8080 attach
      logs: process-compose --address 127.0.0.1 --port 8080 process logs --follow
      restart: process-compose --address 127.0.0.1 --port 8080 process restart application
      shutdown: process-compose --address 127.0.0.1 --port 8080 --ordered-shutdown down
  startupTimeoutSeconds: 120
applications:
  - slug: application
    displayName: Agentic Software Factory Example
    url: http://127.0.0.1:4173
    verification: required
    health:
      url: http://127.0.0.1:4173/api/health/ready
      intervalSeconds: 5
      failureThreshold: 12
